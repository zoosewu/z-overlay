<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE svg [
  <!ENTITY length "300">
  <!ENTITY thickness "2">
  <!ENTITY gap "50">
  <!ENTITY color "#f0f0f0">
]>
<!--
  Crosshair: edit the four values above.
  length     width and height of the cross, in pixels
  thickness  width of each line, in pixels
  gap        radius of the empty space in the middle, in pixels; 0 for a full cross
  color      #RRGGBB or #RRGGBBAA

  Everything is placed by percentage, so the centre is always the middle of
  the image: set the overlay's Position to Center and changing these values
  never moves it. An odd length with an odd thickness (or even with even)
  keeps the lines sharp.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="&length;" height="&length;" shape-rendering="crispEdges">
  <mask id="gap">
    <rect width="100%" height="100%" fill="white"/>
    <circle cx="50%" cy="50%" r="&gap;" fill="black" shape-rendering="geometricPrecision"/>
  </mask>
  <g stroke="&color;" stroke-width="&thickness;" mask="url(#gap)">
    <line x1="0" y1="50%" x2="100%" y2="50%"/>
    <line x1="50%" y1="0" x2="50%" y2="100%"/>
  </g>
</svg>
