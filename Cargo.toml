[package]
name = "z-overlay"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
raw-window-handle = "0.6.2"
resvg = "0.49.0"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
slint = { version = "1.18.1", default-features = false, features = ["std", "compat-1-2", "backend-default", "renderer-software", "accessibility", "system-tray", "raw-window-handle-06"] }
sys-locale = "0.3.2"
ttf-parser = "0.25"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Security", "Win32_System_Diagnostics_ToolHelp", "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_Accessibility", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
slint-build = "1.18.1"
winresource = { version = "0.1.34", default-features = false }

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = "s"
panic = "abort"
strip = true

[[bin]]
name = "z-overlay"
path = "src/main.rs"
test = false
bench = false
